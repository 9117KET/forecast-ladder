[project]
name = "forecast-ladder"
version = "0.1.0"
description = "A fixed-protocol comparison of forecasting methods, from a seasonal naive floor up to a time-series foundation model, on real retail demand data."
requires-python = ">=3.10"
authors = [{ name = "Kinlo Ephriam Tangiri" }]
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "statsforecast>=1.7",
  "mlforecast>=0.12",
  "lightgbm>=4.0",
  "neuralforecast>=1.7",
  "datasetsforecast>=0.0.8",
  "chronos-forecasting",
  "matplotlib>=3.7",
  "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
