# Runs the test suite on every push and pull request.
#
# This is cheap only because the forecasting stack is not installed: requirements.txt has
# no torch and no forecasting libraries, because the forecasts are committed and nothing
# in the tests re-fits a model. The run takes well under a minute.
#
# What it is actually guarding is not just the metrics, which are pure functions and were
# never going to rot. It is tests/test_explorer.py, which asserts that the committed
# artefacts still describe one coherent run: every forecast day has an actual, the
# published tables cover exactly the models in results/raw/, and re-running the seasonal
# naive floor live reproduces the published floor to within 1e-9. Those are the things a
# careless commit can quietly break, and they are what the app depends on being true.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the project was built on. 3.13 and 3.14 are here because a host
        # picks its own interpreter: Streamlit Community Cloud provisioned 3.14, on which
        # the original pins had no wheels at all. requirements.txt carries version markers
        # for that, and this matrix is what keeps them honest.
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest tests/ -q

      # Not `git diff --exit-code`: the tables are not reproducible byte-for-byte across
      # numpy versions, because summing 33,600 costs in a different order moves a total by
      # one unit in the last place. This compares numerically at 1e-9 relative tolerance,
      # which no real change can hide under. See the script's docstring.
      - name: The published tables must still be what the committed forecasts produce
        run: python -u scripts/check_reproducible.py

      - name: The app must at least import cleanly
        run: python -c "import forecast_ladder.explorer as e; e.load_raw_forecasts(); print('ok')"
        env:
          PYTHONPATH: src
